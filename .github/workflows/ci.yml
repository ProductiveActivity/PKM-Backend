name: Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Batalkan build yang usang jika ada commit baru
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Batasi hak akses token runner (Least Privilege)
permissions:
  contents: read

jobs:
  # 1. Audit Keamanan Dependensi
  security-audit:
    name: 🛡️ Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Audit NPM dependencies
        run: npm audit --audit-level=critical

  # 2. Pemeriksaan Kualitas & Sintaks Kode
  code-quality:
    name: 🔍 Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Verify JavaScript syntax integrity
        run: |
          node --check server.js
          node --check src/app.js
          node --check test/health.test.js

  # 3. Uji Coba Otomatis (Node 20.x & 22.x)
  test-suite:
    name: 🧪 Automated Test (Node ${{ matrix.node-version }})
    needs: [security-audit, code-quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (Clean Install)
        run: npm ci

      - name: Run automated test suite
        run: npm test
        env:
          PORT: 5099
          NODE_ENV: test
